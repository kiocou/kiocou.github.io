<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a0a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="neuralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g stroke="#1a2a3a" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="63" x2="1200" y2="63"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="189" x2="1200" y2="189"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="441" x2="1200" y2="441"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="567" x2="1200" y2="567"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Scanline effect -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#scanlineGrad)" opacity="0.1">
    <animate attributeName="y" from="0" to="630" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Left side: Neural network visualization -->
  <g transform="translate(150, 200)">
    <!-- Nodes -->
    <circle cx="0" cy="0" r="25" fill="none" stroke="#00ff88" stroke-width="2" filter="url(#glow)">
      <animate attributeName="r" values="25;28;25" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="8" fill="#00ff88" filter="url(#glow)"/>

    <circle cx="120" cy="-80" r="20" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="-80" r="6" fill="#00d4ff"/>

    <circle cx="120" cy="80" r="20" fill="none" stroke="#a855f7" stroke-width="2" filter="url(#glow)"/>
    <circle cx="120" cy="80" r="6" fill="#a855f7"/>

    <circle cx="240" cy="-120" r="18" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.7"/>
    <circle cx="240" cy="-120" r="5" fill="#00ff88" opacity="0.7"/>

    <circle cx="240" cy="0" r="18" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.7"/>
    <circle cx="240" cy="0" r="5" fill="#00d4ff" opacity="0.7"/>

    <circle cx="240" cy="120" r="18" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
    <circle cx="240" cy="120" r="5" fill="#a855f7" opacity="0.7"/>

    <circle cx="360" cy="-60" r="15" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <circle cx="360" cy="-60" r="4" fill="#00ff88" opacity="0.5"/>

    <circle cx="360" cy="60" r="15" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <circle cx="360" cy="60" r="4" fill="#00d4ff" opacity="0.5"/>

    <!-- Connections -->
    <line x1="0" y1="0" x2="120" y2="-80" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="0" x2="120" y2="80" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
    <line x1="120" y1="-80" x2="240" y2="-120" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="-80" x2="240" y2="0" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="80" x2="240" y2="0" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="80" x2="240" y2="120" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <line x1="240" y1="-120" x2="360" y2="-60" stroke="#00ff88" stroke-width="0.8" opacity="0.4"/>
    <line x1="240" y1="0" x2="360" y2="-60" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="240" y1="0" x2="360" y2="60" stroke="#a855f7" stroke-width="0.8" opacity="0.4"/>
    <line x1="240" y1="120" x2="360" y2="60" stroke="#00ff88" stroke-width="0.8" opacity="0.4"/>

    <!-- Data flow particles -->
    <circle cx="60" cy="-40" r="3" fill="#00ff88" filter="url(#glow)">
      <animate attributeName="cx" values="60;120" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="-40" r="3" fill="#00d4ff" filter="url(#glow)">
      <animate attributeName="cx" values="180;240" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right side: Binary data flow -->
  <g transform="translate(800, 100)" opacity="0.3">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#00ff88">01010011</text>
    <text x="0" y="20" font-family="monospace" font-size="12" fill="#00d4ff">11001010</text>
    <text x="0" y="40" font-family="monospace" font-size="12" fill="#a855f7">00110111</text>
    <text x="0" y="60" font-family="monospace" font-size="12" fill="#00ff88">10101010</text>
    <text x="0" y="80" font-family="monospace" font-size="12" fill="#00d4ff">01110011</text>
    <text x="0" y="100" font-family="monospace" font-size="12" fill="#a855f7">11010100</text>
    <text x="0" y="120" font-family="monospace" font-size="12" fill="#00ff88">00011101</text>
    <text x="0" y="140" font-family="monospace" font-size="12" fill="#00d4ff">10101111</text>
    <text x="0" y="160" font-family="monospace" font-size="12" fill="#a855f7">01010101</text>
    <text x="0" y="180" font-family="monospace" font-size="12" fill="#00ff88">11100010</text>
    <text x="0" y="200" font-family="monospace" font-size="12" fill="#00d4ff">00111000</text>
    <text x="0" y="220" font-family="monospace" font-size="12" fill="#a855f7">10010110</text>
    <text x="0" y="240" font-family="monospace" font-size="12" fill="#00ff88">01101011</text>
    <text x="0" y="260" font-family="monospace" font-size="12" fill="#00d4ff">11000101</text>
    <text x="0" y="280" font-family="monospace" font-size="12" fill="#a855f7">00101111</text>
    <text x="0" y="300" font-family="monospace" font-size="12" fill="#00ff88">10110010</text>
    <text x="0" y="320" font-family="monospace" font-size="12" fill="#00d4ff">01011100</text>
    <text x="0" y="340" font-family="monospace" font-size="12" fill="#a855f7">11101001</text>
    <text x="0" y="360" font-family="monospace" font-size="12" fill="#00ff88">00010110</text>
    <text x="0" y="380" font-family="monospace" font-size="12" fill="#00d4ff">10100011</text>
    <text x="0" y="400" font-family="monospace" font-size="12" fill="#a855f7">01110101</text>
    <text x="0" y="420" font-family="monospace" font-size="12" fill="#00ff88">11001110</text>
    <text x="0" y="440" font-family="monospace" font-size="12" fill="#00d4ff">00110001</text>
    <text x="0" y="460" font-family="monospace" font-size="12" fill="#a855f7">10101011</text>
    <text x="0" y="480" font-family="monospace" font-size="12" fill="#00ff88">01011110</text>
    <text x="0" y="500" font-family="monospace" font-size="12" fill="#00d4ff">11100100</text>
    <text x="0" y="520" font-family="monospace" font-size="12" fill="#a855f7">00011011</text>
    <text x="0" y="540" font-family="monospace" font-size="12" fill="#00ff88">10110101</text>
    <text x="0" y="560" font-family="monospace" font-size="12" fill="#00d4ff">01001111</text>
    <text x="0" y="580" font-family="monospace" font-size="12" fill="#a855f7">11010010</text>
    <text x="0" y="600" font-family="monospace" font-size="12" fill="#00ff88">00101001</text>
  </g>

  <!-- Center: AI chip/brain icon -->
  <g transform="translate(550, 180)">
    <!-- Outer glow rings -->
    <circle cx="100" cy="120" r="100" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.3" filter="url(#strongGlow)">
      <animate attributeName="r" values="100;110;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="120" r="80" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="80;90;80" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Chip body -->
    <rect x="40" y="60" width="120" height="120" rx="15" fill="url(#chipGrad)" stroke="#00ff88" stroke-width="2" filter="url(#glow)"/>

    <!-- Chip pins -->
    <g stroke="#00ff88" stroke-width="2" opacity="0.8">
      <line x1="40" y1="75" x2="20" y2="75"/>
      <line x1="40" y1="95" x2="20" y2="95"/>
      <line x1="40" y1="115" x2="20" y2="115"/>
      <line x1="40" y1="135" x2="20" y2="135"/>
      <line x1="40" y1="155" x2="20" y2="155"/>
      <line x1="160" y1="75" x2="180" y2="75"/>
      <line x1="160" y1="95" x2="180" y2="95"/>
      <line x1="160" y1="115" x2="180" y2="115"/>
      <line x1="160" y1="135" x2="180" y2="135"/>
      <line x1="160" y1="155" x2="180" y2="155"/>
      <line x1="55" y1="60" x2="55" y2="40"/>
      <line x1="75" y1="60" x2="75" y2="40"/>
      <line x1="95" y1="60" x2="95" y2="40"/>
      <line x1="115" y1="60" x2="115" y2="40"/>
      <line x1="135" y1="60" x2="135" y2="40"/>
      <line x1="55" y1="180" x2="55" y2="200"/>
      <line x1="75" y1="180" x2="75" y2="200"/>
      <line x1="95" y1="180" x2="95" y2="200"/>
      <line x1="115" y1="180" x2="115" y2="200"/>
      <line x1="135" y1="180" x2="135" y2="200"/>
    </g>

    <!-- Neural network inside chip -->
    <g transform="translate(60, 80)">
      <circle cx="30" cy="20" r="8" fill="#00ff88" filter="url(#glow)"/>
      <circle cx="70" cy="10" r="6" fill="#00d4ff"/>
      <circle cx="60" cy="50" r="6" fill="#a855f7"/>
      <circle cx="20" cy="50" r="6" fill="#00ff88"/>
      <line x1="30" y1="20" x2="70" y2="10" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
      <line x1="30" y1="20" x2="60" y2="50" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
      <line x1="30" y1="20" x2="20" y2="50" stroke="#a855f7" stroke-width="1" opacity="0.6"/>
      <line x1="70" y1="10" x2="60" y2="50" stroke="#00ff88" stroke-width="1" opacity="0.6"/>
      <line x1="60" y1="50" x2="20" y2="50" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    </g>

    <!-- Pulsing center -->
    <circle cx="100" cy="120" r="15" fill="#00ff88" filter="url(#strongGlow)">
      <animate attributeName="r" values="15;20;15" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.7;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title -->
  <text x="600" y="450" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" filter="url(#glow)">
    XALGORIX
  </text>

  <!-- Subtitle -->
  <text x="600" y="490" font-family="Arial, sans-serif" font-size="18" fill="#8892a4" text-anchor="middle" letter-spacing="4">
    OPEN SOURCE SELF-HOSTED AI SECURITY TESTING PLATFORM
  </text>

  <!-- Bottom tags -->
  <g transform="translate(600, 540)">
    <rect x="-120" y="-15" width="80" height="30" rx="15" fill="#00ff88" fill-opacity="0.2" stroke="#00ff88" stroke-width="1"/>
    <text x="-80" y="5" font-family="Arial, sans-serif" font-size="12" fill="#00ff88" text-anchor="middle">渗透测试</text>

    <rect x="-10" y="-15" width="60" height="30" rx="15" fill="#00d4ff" fill-opacity="0.2" stroke="#00d4ff" stroke-width="1"/>
    <text x="20" y="5" font-family="Arial, sans-serif" font-size="12" fill="#00d4ff" text-anchor="middle">LLM 驱动</text>

    <rect x="50" y="-15" width="80" height="30" rx="15" fill="#a855f7" fill-opacity="0.2" stroke="#a855f7" stroke-width="1"/>
    <text x="90" y="5" font-family="Arial, sans-serif" font-size="12" fill="#a855f7" text-anchor="middle">22阶段扫描</text>
  </g>

  <!-- Corner decorations -->
  <g stroke="#00ff88" stroke-width="2" opacity="0.5">
    <line x1="20" y1="20" x2="20" y2="60"/>
    <line x1="20" y1="20" x2="60" y2="20"/>
    <line x1="1180" y1="20" x2="1140" y2="20"/>
    <line x1="1180" y1="20" x2="1180" y2="60"/>
    <line x1="20" y1="610" x2="20" y2="570"/>
    <line x1="20" y1="610" x2="60" y2="610"/>
    <line x1="1180" y1="610" x2="1180" y2="570"/>
    <line x1="1180" y1="610" x2="1140" y2="610"/>
  </g>

  <!-- Status bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#0a0a1a" fill-opacity="0.8"/>
  <text x="20" y="620" font-family="monospace" font-size="11" fill="#00ff88">● SYSTEM ACTIVE</text>
  <text x="1180" y="620" font-family="monospace" font-size="11" fill="#8892a4" text-anchor="end">v4.0.0</text>
</svg>