<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#fbbf24;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0a0a12;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="noteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="vinylGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#2a2a3a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="63" x2="1200" y2="63"/>
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="189" x2="1200" y2="189"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="441" x2="1200" y2="441"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="0" y1="567" x2="1200" y2="567"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>

  <!-- Audio wave visualization - center -->
  <g transform="translate(600, 200)">
    <!-- Outer glow rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#f97316" stroke-width="2" opacity="0.2" filter="url(#strongGlow)">
      <animate attributeName="r" values="140;150;140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.4"/>

    <!-- Vinyl record style circle -->
    <circle cx="0" cy="0" r="90" fill="url(#vinylGrad)" stroke="#3a3a4a" stroke-width="2" filter="url(#vinylGlow)"/>

    <!-- Vinyl grooves -->
    <g stroke="#2a2a3a" stroke-width="0.5" opacity="0.6">
      <circle cx="0" cy="0" r="85" fill="none"/>
      <circle cx="0" cy="0" r="80" fill="none"/>
      <circle cx="0" cy="0" r="75" fill="none"/>
      <circle cx="0" cy="0" r="70" fill="none"/>
      <circle cx="0" cy="0" r="65" fill="none"/>
      <circle cx="0" cy="0" r="60" fill="none"/>
      <circle cx="0" cy="0" r="55" fill="none"/>
      <circle cx="0" cy="0" r="50" fill="none"/>
      <circle cx="0" cy="0" r="45" fill="none"/>
      <circle cx="0" cy="0" r="40" fill="none"/>
    </g>

    <!-- Center label -->
    <circle cx="0" cy="0" r="25" fill="#1a1a2e" stroke="#f97316" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f97316" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Sound waves radiating from center -->
    <g stroke="url(#waveGrad)" stroke-width="2" opacity="0.7">
      <!-- Wave 1 -->
      <path d="M -130 -60 Q -100 -80 -70 -60 Q -40 -40 -10 -60 Q 20 -80 50 -60 Q 80 -40 110 -60 Q 140 -80 170 -60" fill="none">
        <animate attributeName="d"
          values="M -130 -60 Q -100 -80 -70 -60 Q -40 -40 -10 -60 Q 20 -80 50 -60 Q 80 -40 110 -60 Q 140 -80 170 -60;
                  M -130 -55 Q -100 -75 -70 -55 Q -40 -35 -10 -55 Q 20 -75 50 -55 Q 80 -35 110 -55 Q 140 -75 170 -55;
                  M -130 -60 Q -100 -80 -70 -60 Q -40 -40 -10 -60 Q 20 -80 50 -60 Q 80 -40 110 -60 Q 140 -80 170 -60"
          dur="2s" repeatCount="indefinite"/>
      </path>
      <!-- Wave 2 -->
      <path d="M -130 20 Q -100 0 -70 20 Q -40 40 -10 20 Q 20 0 50 20 Q 80 40 110 20 Q 140 0 170 20" fill="none" opacity="0.5">
        <animate attributeName="d"
          values="M -130 20 Q -100 0 -70 20 Q -40 40 -10 20 Q 20 0 50 20 Q 80 40 110 20 Q 140 0 170 20;
                  M -130 25 Q -100 5 -70 25 Q -40 45 -10 25 Q 20 5 50 25 Q 80 45 110 25 Q 140 5 170 25;
                  M -130 20 Q -100 0 -70 20 Q -40 40 -10 20 Q 20 0 50 20 Q 80 40 110 20 Q 140 0 170 20"
          dur="2.5s" repeatCount="indefinite"/>
      </path>
      <!-- Wave 3 -->
      <path d="M -130 80 Q -100 100 -70 80 Q -40 60 -10 80 Q 20 100 50 80 Q 80 60 110 80 Q 140 100 170 80" fill="none" opacity="0.3">
        <animate attributeName="d"
          values="M -130 80 Q -100 100 -70 80 Q -40 60 -10 80 Q 20 100 50 80 Q 80 60 110 80 Q 140 100 170 80;
                  M -130 85 Q -100 105 -70 85 Q -40 65 -10 85 Q 20 105 50 85 Q 80 65 110 85 Q 140 105 170 85;
                  M -130 80 Q -100 100 -70 80 Q -40 60 -10 80 Q 20 100 50 80 Q 80 60 110 80 Q 140 100 170 80"
          dur="3s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Floating musical notes around the vinyl -->
    <g transform="translate(-100, -100)">
      <!-- Note 1 -->
      <g filter="url(#glow)" opacity="0.9">
        <ellipse cx="15" cy="10" rx="8" ry="10" fill="url(#noteGrad)"/>
        <rect x="13" y="10" width="3" height="35" fill="url(#noteGrad)"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 5,-10; 0,0" dur="4s" repeatCount="indefinite"/>
      </g>
      <!-- Note 2 -->
      <g transform="translate(60, -30)" filter="url(#glow)" opacity="0.7">
        <ellipse cx="15" cy="10" rx="8" ry="10" fill="#fbbf24"/>
        <rect x="13" y="10" width="3" height="35" fill="#fbbf24"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -3,-8; 0,0" dur="3.5s" repeatCount="indefinite"/>
      </g>
      <!-- Note 3 -->
      <g transform="translate(-40, 50)" filter="url(#glow)" opacity="0.5">
        <ellipse cx="15" cy="10" rx="8" ry="10" fill="#a78bfa"/>
        <rect x="13" y="10" width="3" height="35" fill="#a78bfa"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 4,-6; 0,0" dur="3s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Floating notes on the right -->
    <g transform="translate(80, -80)">
      <!-- Note 4 -->
      <g filter="url(#glow)" opacity="0.8">
        <ellipse cx="15" cy="10" rx="8" ry="10" fill="#f97316"/>
        <rect x="13" y="10" width="3" height="35" fill="#f97316"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; -4,-12; 0,0" dur="4.5s" repeatCount="indefinite"/>
      </g>
      <!-- Note 5 -->
      <g transform="translate(-50, 40)" filter="url(#glow)" opacity="0.6">
        <ellipse cx="15" cy="10" rx="8" ry="10" fill="#fbbf24"/>
        <rect x="13" y="10" width="3" height="35" fill="#fbbf24"/>
        <animateTransform attributeName="transform" type="translate" values="0,0; 5,-7; 0,0" dur="3.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Left side: Equalizer bars -->
  <g transform="translate(120, 180)">
    <g opacity="0.7">
      <!-- Bar 1 -->
      <rect x="0" y="0" width="12" height="180" rx="3" fill="#f97316" fill-opacity="0.3"/>
      <rect x="0" y="40" width="12" height="140" rx="3" fill="#f97316">
        <animate attributeName="height" values="140;160;120;140" dur="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y" values="40;20;60;40" dur="1.5s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 2 -->
      <rect x="22" y="0" width="12" height="180" rx="3" fill="#fbbf24" fill-opacity="0.3"/>
      <rect x="22" y="60" width="12" height="120" rx="3" fill="#fbbf24">
        <animate attributeName="height" values="120;140;100;120" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="60;40;80;60" dur="1.8s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 3 -->
      <rect x="44" y="0" width="12" height="180" rx="3" fill="#a78bfa" fill-opacity="0.3"/>
      <rect x="44" y="30" width="12" height="150" rx="3" fill="#a78bfa">
        <animate attributeName="height" values="150;170;130;150" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="30;10;50;30" dur="2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 4 -->
      <rect x="66" y="0" width="12" height="180" rx="3" fill="#f97316" fill-opacity="0.3"/>
      <rect x="66" y="80" width="12" height="100" rx="3" fill="#f97316">
        <animate attributeName="height" values="100;120;80;100" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y" values="80;60;100;80" dur="1.6s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 5 -->
      <rect x="88" y="0" width="12" height="180" rx="3" fill="#fbbf24" fill-opacity="0.3"/>
      <rect x="88" y="50" width="12" height="130" rx="3" fill="#fbbf24">
        <animate attributeName="height" values="130;150;110;130" dur="1.9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="50;30;70;50" dur="1.9s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 6 -->
      <rect x="110" y="0" width="12" height="180" rx="3" fill="#a78bfa" fill-opacity="0.3"/>
      <rect x="110" y="20" width="12" height="160" rx="3" fill="#a78bfa">
        <animate attributeName="height" values="160;180;140;160" dur="2.2s" repeatCount="indefinite"/>
        <animate attributeName="y" values="20;0;40;20" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 7 -->
      <rect x="132" y="0" width="12" height="180" rx="3" fill="#f97316" fill-opacity="0.3"/>
      <rect x="132" y="70" width="12" height="110" rx="3" fill="#f97316">
        <animate attributeName="height" values="110;130;90;110" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="y" values="70;50;90;70" dur="1.7s" repeatCount="indefinite"/>
      </rect>
      <!-- Bar 8 -->
      <rect x="154" y="0" width="12" height="180" rx="3" fill="#fbbf24" fill-opacity="0.3"/>
      <rect x="154" y="45" width="12" height="135" rx="3" fill="#fbbf24">
        <animate attributeName="height" values="135;155;115;135" dur="2.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="45;25;65;45" dur="2.1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="77" y="210" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle" letter-spacing="2">EQUALIZER</text>
  </g>

  <!-- Right side: Code snippet decoration -->
  <g transform="translate(880, 120)" opacity="0.25">
    <rect x="0" y="0" width="200" height="200" rx="10" fill="#0a0a12" stroke="#3a3a4a" stroke-width="1"/>
    <text x="15" y="30" font-family="monospace" font-size="11" fill="#f97316">func Play() {</text>
    <text x="15" y="55" font-family="monospace" font-size="11" fill="#a78bfa">  song := Load()</text>
    <text x="15" y="80" font-family="monospace" font-size="11" fill="#fbbf24">  stream := Open(song.Path)</text>
    <text x="15" y="105" font-family="monospace" font-size="11" fill="#666">  for stream.HasData() {</text>
    <text x="30" y="130" font-family="monospace" font-size="11" fill="#f97316">    buffer := stream.Read(4096)</text>
    <text x="30" y="155" font-family="monospace" font-size="11" fill="#a78bfa">    speaker.Play(buffer)</text>
    <text x="15" y="180" font-family="monospace" font-size="11" fill="#666">  }</text>
    <text x="15" y="205" font-family="monospace" font-size="11" fill="#f97316">}</text>
  </g>

  <!-- Title -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="url(#titleGrad)" text-anchor="middle" filter="url(#glow)">
    WUSIC
  </text>

  <!-- Subtitle -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="16" fill="#8892a4" text-anchor="middle" letter-spacing="3">
    SELF-HOSTED OPEN SOURCE MUSIC PLATFORM
  </text>

  <!-- Bottom tags -->
  <g transform="translate(600, 565)">
    <rect x="-90" y="-14" width="70" height="28" rx="14" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1"/>
    <text x="-55" y="6" font-family="Arial, sans-serif" font-size="11" fill="#f97316" text-anchor="middle">Go 后端</text>

    <rect x="-10" y="-14" width="70" height="28" rx="14" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-width="1"/>
    <text x="25" y="6" font-family="Arial, sans-serif" font-size="11" fill="#fbbf24" text-anchor="middle">Web 前端</text>

    <rect x="60" y="-14" width="80" height="28" rx="14" fill="#a78bfa" fill-opacity="0.2" stroke="#a78bfa" stroke-width="1"/>
    <text x="100" y="6" font-family="Arial, sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">自托管音乐</text>
  </g>

  <!-- Corner decorations -->
  <g stroke="#f97316" stroke-width="2" opacity="0.4">
    <line x1="20" y1="20" x2="20" y2="60"/>
    <line x1="20" y1="20" x2="60" y2="20"/>
    <line x1="1180" y1="20" x2="1140" y2="20"/>
    <line x1="1180" y1="20" x2="1180" y2="60"/>
    <line x1="20" y1="610" x2="20" y2="570"/>
    <line x1="20" y1="610" x2="60" y2="610"/>
    <line x1="1180" y1="610" x2="1180" y2="570"/>
    <line x1="1180" y1="610" x2="1140" y2="610"/>
  </g>

  <!-- Status bar -->
  <rect x="0" y="600" width="1200" height="30" fill="#0f0f1a" fill-opacity="0.8"/>
  <text x="20" y="620" font-family="monospace" font-size="11" fill="#f97316">● PLAYING</text>
  <text x="1180" y="620" font-family="monospace" font-size="11" fill="#8892a4" text-anchor="end">Go + Web</text>
</svg>